name: Local integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # These run only on an ephemeral runner. No repository/hosting secrets.
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install and install the pinned official CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild supabase
          npx --no-install supabase --version
      - name: Start empty isolated backend and apply every migration
        shell: bash
        run: |
          if ! npx --no-install supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            node scripts/redact-local-log.mjs "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
          node scripts/setup-local.mjs
      - name: Build against isolated local configuration
        run: npm run build
      - name: Start local application
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/trulygo-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/trulygo.pid"
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          node scripts/redact-local-log.mjs "$RUNNER_TEMP/trulygo-start.log"
          exit 1
      - name: Verify signup, login, RLS, link review and HTTP redirection
        run: node scripts/test-local.mjs
      - name: Stop the disposable stack
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/trulygo.pid"; then kill "$(cat "$RUNNER_TEMP/trulygo.pid")" || true; fi
          npx --no-install supabase stop --no-backup > "$RUNNER_TEMP/supabase-stop.log" 2>&1 || true
          rm -f .env.local
