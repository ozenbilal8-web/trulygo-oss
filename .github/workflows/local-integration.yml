name: Local integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # These run only on an ephemeral runner. No repository/hosting secrets.
      SUPABASE_TELEMETRY_DISABLED: '1'
      # Official Supabase Docker Hub images avoid ECR anonymous pull limits.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install and install the pinned official CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild supabase
          npx --no-install supabase --version
      - name: Start empty isolated backend and apply every migration
        shell: bash
        run: |
          if ! npx --no-install supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            node scripts/redact-local-log.mjs "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
          node scripts/setup-local.mjs
      - name: Build and verify with an exclusively owned local app server
        run: npm run test:local
      - name: Stop the disposable stack
        if: always()
        shell: bash
        run: |
          npx --no-install supabase stop --no-backup > "$RUNNER_TEMP/supabase-stop.log" 2>&1 || true
          rm -f .env.local
