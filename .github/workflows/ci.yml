name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Tests/builds must never use the hosted service or deployment credentials.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      RESEND_API_KEY: ''
      GOOGLE_WEB_RISK_API_KEY: ''
      CLICK_VISITOR_HASH_SECRET: ''
      TRULYGO_TRUSTED_LINK_CREATE_V2: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install pinned Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Test public browser flows without a backend
        run: npm run test:e2e
      - run: npm run typecheck
      - run: npm run audit
      - run: npm run licenses
