# Isolated contributor stack. Do not link this directory to a hosted project.
# Supabase CLI 2.98.2; all data is disposable local development data.
project_id = "trulygo-oss-local"

[api]
enabled = true
port = 58421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 58422
shadow_port = 58420
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 58423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 58424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/confirm?next=/dashboard", "http://localhost:3000/auth/confirm?next=/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your local TrulyGo account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your local TrulyGo password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
# Manual review works without Google Web Risk or an Edge Function.
enabled = false

[analytics]
enabled = false
